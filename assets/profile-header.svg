<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Seungwan Jeong</title>
  <desc id="desc">ML engineering, backend engineering, and reliable systems. Evidence first, fail closed, reproducible.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.55" stop-color="#0b1729" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.16" cy="0.18" r="0.72">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.86" cy="0.86" r="0.65">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.24" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.075" stroke-width="1" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)" />
  <rect width="1200" height="320" rx="28" fill="url(#glowBlue)" />
  <rect width="1200" height="320" rx="28" fill="url(#glowViolet)" />
  <rect x="1" y="1" width="1198" height="318" rx="27" fill="url(#grid)" stroke="#334155" stroke-opacity="0.7" />

  <g fill="none" stroke="#38bdf8" stroke-opacity="0.33" stroke-width="2">
    <path d="M64 80H220L268 128H360" />
    <path d="M1140 242H982L936 196H842" />
  </g>
  <g fill="#38bdf8">
    <circle cx="64" cy="80" r="5" />
    <circle cx="220" cy="80" r="4" opacity="0.65" />
    <circle cx="360" cy="128" r="5" />
  </g>
  <g fill="#a78bfa">
    <circle cx="1140" cy="242" r="5" />
    <circle cx="982" cy="242" r="4" opacity="0.65" />
    <circle cx="842" cy="196" r="5" />
  </g>

  <g text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="600" y="116" fill="#f8fafc" font-size="54" font-weight="750" letter-spacing="4">SEUNGWAN JEONG</text>
    <text x="600" y="157" fill="#7dd3fc" font-size="18" font-weight="650" letter-spacing="5">ML · BACKEND · RELIABLE SYSTEMS</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">
    <g transform="translate(250 212)">
      <rect width="210" height="46" rx="23" fill="#0f2238" stroke="#0ea5e9" stroke-opacity="0.72" />
      <circle cx="26" cy="23" r="5" fill="#38bdf8" />
      <text x="46" y="28" fill="#bae6fd">EVIDENCE FIRST</text>
    </g>
    <g transform="translate(495 212)">
      <rect width="210" height="46" rx="23" fill="#171b35" stroke="#8b5cf6" stroke-opacity="0.72" />
      <circle cx="26" cy="23" r="5" fill="#a78bfa" />
      <text x="46" y="28" fill="#ddd6fe">FAIL CLOSED</text>
    </g>
    <g transform="translate(740 212)">
      <rect width="210" height="46" rx="23" fill="#10251f" stroke="#22c55e" stroke-opacity="0.72" />
      <circle cx="26" cy="23" r="5" fill="#4ade80" />
      <text x="46" y="28" fill="#bbf7d0">REPRODUCIBLE</text>
    </g>
