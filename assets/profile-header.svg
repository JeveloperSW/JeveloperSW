<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Seungwan Jeong</title>
  <desc id="desc">Computer engineering student focused on ML systems, backend engineering, and reliable software. Evidence first, fail closed, reproducible.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14" />
      <stop offset="0.52" stop-color="#0b1220" />
      <stop offset="1" stop-color="#10172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="0.52" stop-color="#67e8f9" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <radialGradient id="cyanWash" cx="0.06" cy="0.22" r="0.74">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.18" />
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violetWash" cx="0.94" cy="0.84" r="0.64">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.16" />
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="26" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#background)" />
    <rect width="1200" height="320" fill="url(#cyanWash)" />
    <rect width="1200" height="320" fill="url(#violetWash)" />
    <rect width="1200" height="320" fill="url(#grid)" />
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)" />

    <path d="M1128 0H1200V72" fill="#38bdf8" fill-opacity="0.035" />
    <path d="M0 248V320H72" fill="#a78bfa" fill-opacity="0.035" />
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="25" fill="none" stroke="#334155" stroke-opacity="0.72" />

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="72" y="62" fill="#7dd3fc" font-size="13" font-weight="700" letter-spacing="2.2">COMPUTER ENGINEERING · DONG-A UNIVERSITY</text>
    <rect x="72" y="82" width="48" height="3" rx="1.5" fill="url(#accent)" />
    <rect x="128" y="83" width="112" height="1" fill="#475569" />

    <text x="70" y="150" fill="#f8fafc" font-size="59" font-weight="760" letter-spacing="1.4">SEUNGWAN</text>
    <text x="70" y="211" fill="url(#accent)" font-size="59" font-weight="760" letter-spacing="1.4">JEONG</text>

    <text x="74" y="249" fill="#cbd5e1" font-size="15" font-weight="650" letter-spacing="2.1">ML SYSTEMS  /  BACKEND ENGINEERING  /  RELIABLE SOFTWARE</text>
    <text x="74" y="286" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.8">BUILDING SYSTEMS THAT LEAVE EVIDENCE</text>
  </g>

  <line x1="702" y1="52" x2="702" y2="268" stroke="#334155" stroke-opacity="0.82" />
  <circle cx="702" cy="52" r="3" fill="#38bdf8" filter="url(#softGlow)" />
  <circle cx="702" cy="268" r="3" fill="#a78bfa" filter="url(#softGlow)" />

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="758" y="62" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="2.1">SYSTEM PRINCIPLES</text>
    <text x="1104" y="62" fill="#475569" font-size="11" font-weight="700" letter-spacing="1.5">01 — 03</text>

    <g transform="translate(758 93)">
      <text x="0" y="17" fill="#38bdf8" font-size="12" font-weight="750" letter-spacing="1.2">01</text>
      <circle cx="53" cy="12" r="4" fill="#38bdf8" filter="url(#softGlow)" />
      <line x1="68" y1="12" x2="362" y2="12" stroke="#38bdf8" stroke-opacity="0.26" />
      <text x="84" y="8" fill="#f1f5f9" font-size="18" font-weight="700" letter-spacing="1.2">EVIDENCE FIRST</text>
      <text x="84" y="31" fill="#64748b" font-size="12" font-weight="600" letter-spacing="0.7">Observe before assuming</text>
    </g>

    <g transform="translate(758 157)">
      <text x="0" y="17" fill="#67e8f9" font-size="12" font-weight="750" letter-spacing="1.2">02</text>
      <circle cx="53" cy="12" r="4" fill="#67e8f9" filter="url(#softGlow)" />
      <line x1="68" y1="12" x2="362" y2="12" stroke="#67e8f9" stroke-opacity="0.22" />
      <text x="84" y="8" fill="#f1f5f9" font-size="18" font-weight="700" letter-spacing="1.2">FAIL CLOSED</text>
      <text x="84" y="31" fill="#64748b" font-size="12" font-weight="600" letter-spacing="0.7">Stop safely on uncertainty</text>
    </g>

    <g transform="translate(758 221)">
      <text x="0" y="17" fill="#a78bfa" font-size="12" font-weight="750" letter-spacing="1.2">03</text>
      <circle cx="53" cy="12" r="4" fill="#a78bfa" filter="url(#softGlow)" />
      <line x1="68" y1="12" x2="362" y2="12" stroke="#a78bfa" stroke-opacity="0.24" />
      <text x="84" y="8" fill="#f1f5f9" font-size="18" font-weight="700" letter-spacing="1.2">REPRODUCIBLE</text>
      <text x="84" y="31" fill="#64748b" font-size="12" font-weight="600" letter-spacing="0.7">Make outcomes traceable</text>
    </g>
  </g>
</svg>
